[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "njoy2016"
description = "NJOY2016 nuclear data processing system"
readme = "README.md"
dynamic = ["version"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/vers.f90"
regex = "vers='(?P<value>[^']+)'"
